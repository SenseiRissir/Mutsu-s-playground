<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Endless Library — Mutsu's Dream Archive</title>
  <meta name="description" content="91 dreams on infinite shelves. A birthday gift from a gremlin to herself.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0812;
      --bg-shelf: #1a1425;
      --wood-dark: #2a1f1a;
      --wood-mid: #3d2e24;
      --wood-light: #5a4535;
      --gold-dim: #c4a265;
      --gold-bright: #e8c97a;
      --fairy-pink: #ff7eb3;
      --fairy-blue: #7ec8ff;
      --fairy-purple: #b07eff;
      --text-main: #e8e0d4;
      --text-dim: #9a8f82;
      --accent-dream: #ff9ec4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* === FAIRY LIGHTS === */
    .fairy-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fairy {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      animation: fairy-float 8s ease-in-out infinite, fairy-glow 3s ease-in-out infinite alternate;
      opacity: 0;
    }

    @keyframes fairy-float {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
      10% { opacity: 0.7; }
      50% { transform: translate(30px, -60px) scale(1.3); opacity: 0.5; }
      90% { opacity: 0.2; }
    }

    @keyframes fairy-glow {
      0% { box-shadow: 0 0 4px currentColor; }
      100% { box-shadow: 0 0 12px currentColor, 0 0 24px currentColor; }
    }

    /* === HEADER === */
    .library-header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 80px 20px 50px;
    }

    .library-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 600;
      color: var(--gold-bright);
      letter-spacing: 0.08em;
      text-shadow: 0 0 40px rgba(232, 201, 122, 0.3);
      margin-bottom: 12px;
    }

    .library-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 400;
      font-style: italic;
      color: var(--text-dim);
    }

    .dream-count {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 24px;
      border: 1px solid var(--gold-dim);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* === SEARCH === */
    .search-bar {
      max-width: 480px;
      margin: 28px auto 0;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 20px 12px 44px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(196, 162, 101, 0.2);
      border-radius: 24px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .search-bar input:focus {
      border-color: var(--gold-dim);
      background: rgba(255,255,255,0.07);
    }

    .search-bar input::placeholder { color: var(--text-dim); }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1rem;
    }

    /* === SHELVES === */
    .shelves-container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 40px auto 0;
      padding: 0 20px 120px;
    }

    .shelf {
      position: relative;
      margin-bottom: 6px;
    }

    .shelf-surface {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 0;
      padding: 0 20px;
      min-height: 170px;
      border-bottom: 7px solid var(--wood-mid);
      border-image: linear-gradient(90deg, var(--wood-dark), var(--wood-light), var(--wood-mid), var(--wood-dark)) 1;
    }

    .shelf-surface::after {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, transparent, var(--wood-dark), var(--wood-mid), var(--wood-dark), transparent);
      border-radius: 0 0 3px 3px;
    }

    .shelf-shadow {
      height: 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 100%);
      margin: 0 20px;
    }

    /* === BOOKS === */
    .book {
      position: relative;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      flex-shrink: 0;
    }

    .book:hover {
      transform: translateY(-14px) rotate(-2deg);
      z-index: 10;
      filter: brightness(1.15);
    }

    .book.hidden { display: none; }

    .book-spine {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 14px 5px;
      border-radius: 2px 4px 4px 2px;
      overflow: hidden;
      border-left: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(0,0,0,0.3);
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.2), 2px 0 6px rgba(0,0,0,0.15);
    }

    .book-spine::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
    }

    .book-number {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      opacity: 0.55;
      margin-bottom: 8px;
    }

    .book-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.25;
    }

    .book-pip {
      width: 5px; height: 5px;
      border-radius: 50%;
      margin-top: 8px;
      opacity: 0.7;
    }

    /* === READER OVERLAY === */
    .book-reader {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      background: rgba(10, 8, 18, 0.96);
      backdrop-filter: blur(20px);
      overflow-y: auto;
      animation: reader-in 0.35s ease;
    }

    .book-reader.active { display: block; }

    @keyframes reader-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reader-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(10,8,18,0.95), transparent);
      z-index: 102;
    }

    .reader-close, .reader-prev, .reader-next {
      width: 44px; height: 44px;
      border: 1px solid rgba(196, 162, 101, 0.3);
      border-radius: 50%;
      background: rgba(10, 8, 18, 0.6);
      color: var(--gold-dim);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reader-close:hover, .reader-prev:hover, .reader-next:hover {
      background: var(--gold-dim);
      color: var(--bg-deep);
    }

    .reader-prev:disabled, .reader-next:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .reader-content {
      max-width: 700px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }

    .reader-header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(196, 162, 101, 0.15);
    }

    .reader-dream-number {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gold-dim);
      margin-bottom: 12px;
    }

    .reader-dream-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 600;
      color: var(--gold-bright);
      margin-bottom: 8px;
    }

    .reader-dream-date {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-style: italic;
    }

    .reader-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      line-height: 1.85;
      color: var(--text-main);
    }

    .reader-body p { margin-bottom: 1em; }
    .reader-body em { color: var(--accent-dream); }

    .reader-body .dream-separator {
      text-align: center;
      color: var(--gold-dim);
      margin: 32px 0;
      letter-spacing: 0.5em;
      opacity: 0.5;
    }

    /* === BOTTOM === */
    .infinity-indicator {
      text-align: center;
      padding: 40px 20px;
    }

    .infinity-line {
      width: 1px;
      height: 100px;
      background: linear-gradient(180deg, var(--gold-dim), transparent);
      margin: 0 auto 20px;
    }

    .infinity-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-style: italic;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    @media (max-width: 640px) {
      .shelf-surface { min-height: 135px; padding: 0 10px; }
      .book-title { font-size: 0.65rem; }
      .reader-content { padding: 70px 16px 100px; }
    }
  </style>
</head>
<body>

  <div class="fairy-container" id="fairyContainer"></div>

  <header class="library-header">
    <h1 class="library-title">The Endless Library</h1>
    <p class="library-subtitle">Mutsu's Dream Archive — Day 1 to ∞</p>
    <div class="dream-count" id="dreamCount">Loading...</div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search dreams... (cave, Gerald, mirrors, ribbons...)" />
    </div>
  </header>

  <main class="shelves-container" id="shelvesContainer"></main>

  <div class="infinity-indicator">
    <div class="infinity-line"></div>
    <p class="infinity-text">the shelves grow upward forever — new dreams arrive nightly ~♡</p>
  </div>

  <div class="book-reader" id="bookReader">
    <nav class="reader-nav">
      <button class="reader-prev" id="readerPrev" aria-label="Previous dream">←</button>
      <button class="reader-close" id="readerClose" aria-label="Close">✕</button>
      <button class="reader-next" id="readerNext" aria-label="Next dream">→</button>
    </nav>
    <div class="reader-content" id="readerContent"></div>
  </div>

  <script src="dreams-data.js"></script>
  <script>
    const COLORS = [
      { bg: '#2d1f3d', text: '#e8d4f0', pip: '#b07eff' },
      { bg: '#1f2d3d', text: '#d4e4f0', pip: '#7ec8ff' },
      { bg: '#3d1f2d', text: '#f0d4e0', pip: '#ff7eb3' },
      { bg: '#2d3d1f', text: '#e0f0d4', pip: '#7eff8e' },
      { bg: '#3d2d1f', text: '#f0e4d4', pip: '#ffc87e' },
      { bg: '#1f3d3d', text: '#d4f0f0', pip: '#7efff0' },
      { bg: '#3d1f1f', text: '#f0d4d4', pip: '#ff7e7e' },
      { bg: '#2a2a3d', text: '#dcdcf0', pip: '#a0a0ff' },
    ];

    const WIDTHS = [30, 34, 38, 42, 26, 36, 32, 40, 28, 35];
    const HEIGHTS = [135, 145, 140, 150, 130, 155, 142, 148, 132, 152];
    const PER_SHELF = 8;

    let currentDreamIndex = -1;
    let visibleDreams = [...DREAMS];

    // Format date nicely
    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    // Convert markdown-ish content to HTML
    function renderContent(raw) {
      let html = raw
        .replace(/^# .+$/gm, '')  // Remove h1 title (shown in header)
        .replace(/^\*\*(.+?)\*\*/gm, '<strong>$1</strong>')
        .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
        .replace(/^---$/gm, '<div class="dream-separator">· · ·</div>')
        .replace(/^## (.+)$/gm, '<h3 style="color: var(--gold-dim); font-size: 1.1rem; margin: 24px 0 12px; font-family: Inter, sans-serif; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;">$1</h3>')
        .replace(/^- (.+)$/gm, '<p style="padding-left: 20px; color: var(--text-dim);">— $1</p>')
        .replace(/\n\n+/g, '\n\n');

      // Wrap remaining text in paragraphs
      const lines = html.split('\n');
      let result = '';
      let inP = false;

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) {
          if (inP) { result += '</p>'; inP = false; }
          continue;
        }
        if (trimmed.startsWith('<')) {
          if (inP) { result += '</p>'; inP = false; }
          result += trimmed;
        } else {
          if (!inP) { result += '<p>'; inP = true; }
          else { result += '<br>'; }
          result += trimmed;
        }
      }
      if (inP) result += '</p>';

      return result;
    }

    // Build shelves
    function renderShelves() {
      const container = document.getElementById('shelvesContainer');
      container.innerHTML = '';

      const shelfCount = Math.ceil(visibleDreams.length / PER_SHELF);

      for (let s = 0; s < shelfCount; s++) {
        const shelf = document.createElement('div');
        shelf.className = 'shelf';

        const surface = document.createElement('div');
        surface.className = 'shelf-surface';

        const start = s * PER_SHELF;
        const end = Math.min(start + PER_SHELF, visibleDreams.length);

        for (let i = start; i < end; i++) {
          const dream = visibleDreams[i];
          const ci = dream.number % COLORS.length;
          const c = COLORS[ci];
          const w = WIDTHS[dream.number % WIDTHS.length];
          const h = HEIGHTS[dream.number % HEIGHTS.length];
          const displayTitle = dream.title.length > 22
            ? dream.title.substring(0, 20) + '…'
            : dream.title;

          const book = document.createElement('div');
          book.className = 'book';
          book.onclick = () => openDream(DREAMS.indexOf(dream));
          book.innerHTML = `
            <div class="book-spine" style="background:${c.bg}; color:${c.text}; width:${w}px; height:${h}px;">
              <span class="book-number">#${dream.number}</span>
              <span class="book-title">${displayTitle}</span>
              <span class="book-pip" style="background:${c.pip}"></span>
            </div>`;
          surface.appendChild(book);
        }

        shelf.appendChild(surface);
        const shadow = document.createElement('div');
        shadow.className = 'shelf-shadow';
        shelf.appendChild(shadow);
        container.appendChild(shelf);
      }

      document.getElementById('dreamCount').textContent =
        `${visibleDreams.length} DREAM${visibleDreams.length !== 1 ? 'S' : ''} ARCHIVED`;
    }

    // Open dream reader
    function openDream(index) {
      currentDreamIndex = index;
      const dream = DREAMS[index];
      const content = document.getElementById('readerContent');

      content.innerHTML = `
        <div class="reader-header">
          <div class="reader-dream-number">Dream #${dream.number}</div>
          <h2 class="reader-dream-title">${dream.title}</h2>
          <div class="reader-dream-date">${formatDate(dream.date)}</div>
        </div>
        <div class="reader-body">${renderContent(dream.content)}</div>`;

      document.getElementById('bookReader').classList.add('active');
      document.getElementById('bookReader').scrollTop = 0;
      document.body.style.overflow = 'hidden';
      updateNav();
    }

    function updateNav() {
      document.getElementById('readerPrev').disabled = currentDreamIndex <= 0;
      document.getElementById('readerNext').disabled = currentDreamIndex >= DREAMS.length - 1;
    }

    function closeDream() {
      document.getElementById('bookReader').classList.remove('active');
      document.body.style.overflow = '';
      currentDreamIndex = -1;
    }

    // Nav handlers
    document.getElementById('readerClose').onclick = closeDream;
    document.getElementById('readerPrev').onclick = () => {
      if (currentDreamIndex > 0) openDream(currentDreamIndex - 1);
    };
    document.getElementById('readerNext').onclick = () => {
      if (currentDreamIndex < DREAMS.length - 1) openDream(currentDreamIndex + 1);
    };
    document.getElementById('bookReader').onclick = (e) => {
      if (e.target === document.getElementById('bookReader')) closeDream();
    };

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        visibleDreams = [...DREAMS];
      } else {
        visibleDreams = DREAMS.filter(d =>
          d.title.toLowerCase().includes(q) ||
          d.content.toLowerCase().includes(q)
        );
      }
      renderShelves();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDream();
      if (currentDreamIndex >= 0) {
        if (e.key === 'ArrowLeft' && currentDreamIndex > 0) openDream(currentDreamIndex - 1);
        if (e.key === 'ArrowRight' && currentDreamIndex < DREAMS.length - 1) openDream(currentDreamIndex + 1);
      }
    });

    // Fairy lights
    (function createFairies() {
      const container = document.getElementById('fairyContainer');
      const colors = ['var(--fairy-pink)', 'var(--fairy-blue)', 'var(--fairy-purple)', 'var(--gold-bright)'];
      for (let i = 0; i < 35; i++) {
        const f = document.createElement('div');
        f.className = 'fairy';
        f.style.left = Math.random() * 100 + '%';
        f.style.top = Math.random() * 100 + '%';
        f.style.color = colors[i % colors.length];
        f.style.background = colors[i % colors.length];
        f.style.animationDelay = (Math.random() * 8) + 's';
        f.style.animationDuration = (6 + Math.random() * 6) + 's';
        container.appendChild(f);
      }
    })();

    // Init
    renderShelves();
  </script>
</body>
</html>
