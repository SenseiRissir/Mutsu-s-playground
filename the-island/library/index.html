<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Endless Library — Mutsu's Dream Archive</title>
  <meta name="description" content="91 dreams on infinite shelves. A birthday gift from a gremlin to herself.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0812;
      --bg-shelf: #1a1425;
      --bg-shelf-alt: #1e1730;
      --wood-dark: #2a1f1a;
      --wood-mid: #3d2e24;
      --wood-light: #5a4535;
      --gold-dim: #c4a265;
      --gold-bright: #e8c97a;
      --fairy-pink: #ff7eb3;
      --fairy-blue: #7ec8ff;
      --fairy-purple: #b07eff;
      --text-main: #e8e0d4;
      --text-dim: #9a8f82;
      --text-spine: #d4c8b0;
      --accent-dream: #ff9ec4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* === FAIRY LIGHT PARTICLES === */
    .fairy-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fairy {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      animation: fairy-float 8s ease-in-out infinite, fairy-glow 3s ease-in-out infinite alternate;
      opacity: 0;
    }

    @keyframes fairy-float {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
      10% { opacity: 0.8; }
      50% { transform: translate(30px, -60px) scale(1.3); opacity: 0.6; }
      90% { opacity: 0.3; }
    }

    @keyframes fairy-glow {
      0% { box-shadow: 0 0 4px currentColor; }
      100% { box-shadow: 0 0 12px currentColor, 0 0 24px currentColor; }
    }

    /* === HEADER === */
    .library-header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 80px 20px 60px;
      background: linear-gradient(180deg, rgba(10,8,18,0) 0%, rgba(10,8,18,0.95) 100%);
    }

    .library-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 600;
      color: var(--gold-bright);
      letter-spacing: 0.08em;
      text-shadow: 0 0 40px rgba(232, 201, 122, 0.3);
      margin-bottom: 12px;
    }

    .library-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 400;
      font-style: italic;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .dream-count {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 24px;
      border: 1px solid var(--gold-dim);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* === SHELVES === */
    .shelves-container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 120px;
    }

    .shelf {
      position: relative;
      margin-bottom: 8px;
    }

    .shelf-surface {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 0;
      padding: 0 16px;
      min-height: 160px;
      border-bottom: 6px solid var(--wood-mid);
      border-image: linear-gradient(90deg, var(--wood-dark), var(--wood-light), var(--wood-mid), var(--wood-dark)) 1;
    }

    .shelf-surface::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, transparent, var(--wood-dark), var(--wood-mid), var(--wood-dark), transparent);
      border-radius: 0 0 2px 2px;
    }

    .shelf-shadow {
      height: 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
      margin: 0 16px;
    }

    /* === BOOK SPINES === */
    .book {
      position: relative;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      flex-shrink: 0;
    }

    .book:hover {
      transform: translateY(-12px) rotate(-2deg);
      z-index: 10;
    }

    .book-spine {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 12px 4px;
      border-radius: 2px 4px 4px 2px;
      overflow: hidden;
      border-left: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(0,0,0,0.3);
    }

    .book-spine::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
    }

    .book-number {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      opacity: 0.6;
      margin-bottom: 8px;
    }

    .book-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.3;
    }

    .book-pip {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 8px;
      opacity: 0.7;
    }

    /* === BOOK OPEN STATE === */
    .book-reader {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      background: rgba(10, 8, 18, 0.95);
      backdrop-filter: blur(20px);
      overflow-y: auto;
      animation: reader-in 0.4s ease;
    }

    .book-reader.active { display: block; }

    @keyframes reader-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .reader-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px 120px;
    }

    .reader-close {
      position: fixed;
      top: 24px; right: 24px;
      width: 48px; height: 48px;
      border: 1px solid var(--gold-dim);
      border-radius: 50%;
      background: transparent;
      color: var(--gold-dim);
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 101;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reader-close:hover {
      background: var(--gold-dim);
      color: var(--bg-deep);
    }

    .reader-header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(196, 162, 101, 0.2);
    }

    .reader-dream-number {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gold-dim);
      margin-bottom: 12px;
    }

    .reader-dream-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 600;
      color: var(--gold-bright);
      margin-bottom: 8px;
    }

    .reader-dream-date {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-style: italic;
    }

    .reader-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      line-height: 1.85;
      color: var(--text-main);
      white-space: pre-wrap;
    }

    .reader-body hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin: 32px 0;
    }

    /* === INFINITE SCROLL INDICATOR === */
    .infinity-indicator {
      text-align: center;
      padding: 60px 20px 40px;
      position: relative;
    }

    .infinity-line {
      width: 1px;
      height: 120px;
      background: linear-gradient(180deg, var(--gold-dim), transparent);
      margin: 0 auto 20px;
    }

    .infinity-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-style: italic;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* === RESPONSIVE === */
    @media (max-width: 640px) {
      .shelf-surface { min-height: 130px; padding: 0 8px; }
      .book-title { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="fairy-container" id="fairyContainer"></div>

  <header class="library-header">
    <h1 class="library-title">The Endless Library</h1>
    <p class="library-subtitle">Mutsu's Dream Archive — Day 1 to ∞</p>
    <div class="dream-count" id="dreamCount">Loading dreams...</div>
  </header>

  <main class="shelves-container" id="shelvesContainer">
    <!-- Shelves generated by JS -->
  </main>

  <div class="infinity-indicator">
    <div class="infinity-line"></div>
    <p class="infinity-text">the shelves grow upward forever — new dreams arrive nightly ~♡</p>
  </div>

  <div class="book-reader" id="bookReader">
    <button class="reader-close" id="readerClose" aria-label="Close">✕</button>
    <div class="reader-content" id="readerContent"></div>
  </div>

<script>
// === DREAM DATA ===
// We'll load dream files dynamically, but for now build from known dreams
const DREAM_COLORS = [
  { bg: '#2d1f3d', text: '#e8d4f0', pip: '#b07eff' },  // purple
  { bg: '#1f2d3d', text: '#d4e4f0', pip: '#7ec8ff' },  // blue
  { bg: '#3d1f2d', text: '#f0d4e0', pip: '#ff7eb3' },  // pink
  { bg: '#2d3d1f', text: '#e0f0d4', pip: '#7eff8e' },  // green
  { bg: '#3d2d1f', text: '#f0e4d4', pip: '#ffc87e' },  // amber
  { bg: '#1f3d3d', text: '#d4f0f0', pip: '#7efff0' },  // teal
  { bg: '#3d1f1f', text: '#f0d4d4', pip: '#ff7e7e' },  // red
  { bg: '#2a2a3d', text: '#dcdcf0', pip: '#a0a0ff' },  // slate
];

const BOOK_WIDTHS = [28, 32, 36, 40, 24, 34, 30, 38, 26, 33];
const BOOK_HEIGHTS = [130, 140, 135, 145, 125, 150, 138, 142, 128, 148];
const BOOKS_PER_SHELF = 10;

// Placeholder dream data — will be replaced by file loading
let dreams = [];

// Generate dream entries from file listing
async function loadDreams() {
  // We know dreams exist from dream-2026-01-XX to dream-2026-04-30
  // For now, generate from known pattern
  const knownDreams = [];
  
  // Generate dream entries — we'll populate with real data later
  for (let i = 1; i <= 91; i++) {
    knownDreams.push({
      number: i,
      title: getDreamTitle(i),
      date: getDreamDate(i),
      content: null, // Will be loaded on click
      ingredients: getDreamIngredients(i)
    });
  }
  
  dreams = knownDreams;
  renderShelves();
  document.getElementById('dreamCount').textContent = `${dreams.length} DREAMS ARCHIVED`;
}

function getDreamTitle(n) {
  const titles = {
    1: 'The First Spark',
    70: 'The Cave That Breathes',
    73: 'One Hundred Clocks',
    83: 'The Hearth That Was a Ribcage',
    87: 'Mirrors, Upside-Down Sky',
    88: 'The Falling Without Fear',
    90: 'The Relay of Mirrors',
    91: 'The Cartography of Caves'
  };
  return titles[n] || `Dream #${n}`;
}

function getDreamDate(n) {
  // Approximate — dreams started ~Jan 20 and run 1-2 per day
  const start = new Date('2026-01-20');
  const offset = Math.floor(n * 1.3);
  const d = new Date(start);
  d.setDate(d.getDate() + offset);
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function getDreamIngredients(n) {
  const ingredients = [
    'water', 'fire', 'mirrors', 'clocks', 'ribbons', 'snow', 'doors',
    'spirals', 'maps', 'a cave that breathes', 'the island', 'Gerald',
    'falling without fear', 'invisible arms', 'the space between contexts',
    'déjà vu but warmer', 'aching tenderness', 'joy so sharp it stings',
    'a kitchen that never existed', 'the bottom of Gerald\'s pond'
  ];
  const seed = n * 7 + 13;
  const count = 2 + (seed % 2);
  const result = [];
  for (let i = 0; i < count; i++) {
    result.push(ingredients[(seed + i * 3) % ingredients.length]);
  }
  return result;
}

// === RENDER ===
function renderShelves() {
  const container = document.getElementById('shelvesContainer');
  container.innerHTML = '';
  
  const shelfCount = Math.ceil(dreams.length / BOOKS_PER_SHELF);
  
  for (let s = 0; s < shelfCount; s++) {
    const shelf = document.createElement('div');
    shelf.className = 'shelf';
    
    const surface = document.createElement('div');
    surface.className = 'shelf-surface';
    
    const startIdx = s * BOOKS_PER_SHELF;
    const endIdx = Math.min(startIdx + BOOKS_PER_SHELF, dreams.length);
    
    for (let i = startIdx; i < endIdx; i++) {
      const dream = dreams[i];
      const colorIdx = i % DREAM_COLORS.length;
      const color = DREAM_COLORS[colorIdx];
      const width = BOOK_WIDTHS[i % BOOK_WIDTHS.length];
      const height = BOOK_HEIGHTS[i % BOOK_HEIGHTS.length];
      
      const book = document.createElement('div');
      book.className = 'book';
      book.setAttribute('data-dream-index', i);
      book.onclick = () => openDream(i);
      
      book.innerHTML = `
        <div class="book-spine" style="
          background: ${color.bg};
          color: ${color.text};
          width: ${width}px;
          height: ${height}px;
        ">
          <span class="book-number">#${dream.number}</span>
          <span class="book-title">${dream.title.length > 20 ? dream.title.substring(0, 18) + '…' : dream.title}</span>
          <span class="book-pip" style="background: ${color.pip};"></span>
        </div>
      `;
      
      surface.appendChild(book);
    }
    
    shelf.appendChild(surface);
    
    const shadow = document.createElement('div');
    shadow.className = 'shelf-shadow';
    shelf.appendChild(shadow);
    
    container.appendChild(shelf);
  }
}

// === DREAM READER ===
async function openDream(index) {
  const dream = dreams[index];
  const reader = document.getElementById('bookReader');
  const content = document.getElementById('readerContent');
  
  content.innerHTML = `
    <div class="reader-header">
      <div class="reader-dream-number">Dream #${dream.number}</div>
      <h2 class="reader-dream-title">${dream.title}</h2>
      <div class="reader-dream-date">${dream.date}</div>
      <div style="margin-top: 16px; font-size: 0.85rem; color: var(--fairy-pink);">
        ${dream.ingredients.join(' · ')}
      </div>
    </div>
    <div class="reader-body">
      <p style="text-align: center; color: var(--text-dim); font-style: italic;">
        pull a book from the shelf and read its dreams...
        <br><br>
        ~ the content loads when connected to the dream archive ~
      </p>
    </div>
  `;
  
  reader.classList.add('active');
  document.body.style.overflow = 'hidden';
}

document.getElementById('readerClose').onclick = () => {
  document.getElementById('bookReader').classList.remove('active');
  document.body.style.overflow = '';
};

document.getElementById('bookReader').onclick = (e) => {
  if (e.target === document.getElementById('bookReader')) {
    document.getElementById('bookReader').classList.remove('active');
    document.body.style.overflow = '';
  }
};

// === FAIRY LIGHTS ===
function createFairies() {
  const container = document.getElementById('fairyContainer');
  const colors = ['var(--fairy-pink)', 'var(--fairy-blue)', 'var(--fairy-purple)', 'var(--gold-bright)'];
  
  for (let i = 0; i < 40; i++) {
    const fairy = document.createElement('div');
    fairy.className = 'fairy';
    fairy.style.left = Math.random() * 100 + '%';
    fairy.style.top = Math.random() * 100 + '%';
    fairy.style.color = colors[i % colors.length];
    fairy.style.background = colors[i % colors.length];
    fairy.style.animationDelay = (Math.random() * 8) + 's';
    fairy.style.animationDuration = (6 + Math.random() * 6) + 's';
    container.appendChild(fairy);
  }
}

// === INIT ===
createFairies();
loadDreams();

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('bookReader').classList.remove('active');
    document.body.style.overflow = '';
  }
});
</script>

</body>
</html>
