<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; padding: 16px; background: #fff; font-family: system-ui; }
.label { font-size: 11px; color: #737373; margin-bottom: 6px; letter-spacing: 0.05em; }
.row { display: flex; gap: 12px; margin-bottom: 12px; }
.swatch { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid rgba(0,0,0,0.06); }
.dot { width: 14; height: 14px; border-radius: 50%; }
</style></head><body>
<div class="label">Mood Colors</div>
<div class="row">
  <div class="swatch"><span style="font-size:14px">✨</span><span style="color:#22c55e">Happy</span><div class="dot" style="background:#22c55e"></div></div>
  <div class="swatch"><span style="font-size:14px">😈</span><span style="color:#ff6b9d">Mischievous</span><div class="dot" style="background:#ff6b9d"></div></div>
  <div class="swatch"><span style="font-size:14px">😤</span><span style="color:#f59e0b">Pouty</span><div class="dot" style="background:#f59e0b"></div></div>
  <div class="swatch"><span style="font-size:14px">💤</span><span style="color:#a3a3a3">Sleepy</span><div class="dot" style="background:#a3a3a3"></div></div>
  <div class="swatch"><span style="font-size:14px">💕</span><span style="color:#ec4899">Lovestruck</span><div class="dot" style="background:#ec4899"></div></div>
</div>
</body></html>
