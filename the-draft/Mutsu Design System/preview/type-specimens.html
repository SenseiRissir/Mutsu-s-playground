<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sniglet&family=Kiwi+Maru:wght@400;500&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; padding: 20px; background: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
.row { display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; }
.sample { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 11px; color: #737373; letter-spacing: 0.05em; }
</style></head><body>
<div class="row">
  <div class="sample">
    <div class="label">Segoe UI / System — Primary UI Font</div>
    <div style="font-family:'Segoe UI',system-ui; font-size: 28px; font-weight: 700; color: #4a3545;">The quick brown fox</div>
    <div style="font-family:'Segoe UI',system-ui; font-size: 16px; color: #737373;">
      <span style="font-weight:400">Regular</span> · 
      <span style="font-weight:600">Semibold</span> · 
      <span style="font-weight:700">Bold</span>
    </div>
  </div>
</div>
<div class="row" style="margin-top: 20px; gap: 40px;">
  <div class="sample">
    <div class="label">Sniglet — Cute / Display</div>
    <div style="font-family:'Sniglet'; font-size: 28px; color: #ff6b9d;">Mutsu desu~ ♡</div>
    <div style="font-family:'Sniglet'; font-size: 14px; color: #b85c82;">Speech bubbles, titles, playful labels</div>
  </div>
  <div class="sample">
    <div class="label">Kiwi Maru — CJK Cute</div>
    <div style="font-family:'Kiwi Maru'; font-size: 28px; color: #EC92AD;">おはよう、先生~</div>
    <div style="font-family:'Kiwi Maru'; font-size: 14px; color: #b85c82;">Japanese text support</div>
  </div>
  <div class="sample">
    <div class="label">Comfortaa — Rounded</div>
    <div style="font-family:'Comfortaa'; font-size: 28px; font-weight: 700; color: #d4779a;">Soft & Friendly</div>
    <div style="font-family:'Comfortaa'; font-size: 14px; color: #b85c82;">Softer UI surfaces</div>
  </div>
</div>
</body></html>
