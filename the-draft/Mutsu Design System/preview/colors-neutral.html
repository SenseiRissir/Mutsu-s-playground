<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; padding: 16px; background: #fff; font-family: system-ui; }
.scale { display: flex; gap: 0; height: 56px; border-radius: 8px; overflow: hidden; }
.swatch { flex: 1; display: flex; align-items: flex-end; padding: 4px 6px; font-size: 10px; font-weight: 500; }
.label { font-size: 11px; color: #737373; margin-bottom: 6px; letter-spacing: 0.05em; }
</style></head><body>
<div>
  <div class="label">Neutral Scale</div>
  <div class="scale">
    <div class="swatch" style="background: #fafafa; color: #4a3545;">50</div>
    <div class="swatch" style="background: #f5f5f5; color: #4a3545;">100</div>
    <div class="swatch" style="background: #e5e5e5; color: #4a3545;">200</div>
    <div class="swatch" style="background: #d4d4d4; color: #4a3545;">300</div>
    <div class="swatch" style="background: #a3a3a3; color: #fff;">400</div>
    <div class="swatch" style="background: #737373; color: #fff;">500</div>
    <div class="swatch" style="background: #525252; color: #fff;">600</div>
    <div class="swatch" style="background: #404040; color: #fff;">700</div>
    <div class="swatch" style="background: #262626; color: #fff;">800</div>
    <div class="swatch" style="background: #1a1a2e; color: #EC92AD;">app</div>
  </div>
</div>
</body></html>
