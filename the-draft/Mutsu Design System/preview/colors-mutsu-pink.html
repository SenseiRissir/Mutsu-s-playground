<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; padding: 16px; background: #fff; font-family: system-ui; }
.scale { display: flex; gap: 0; height: 60px; border-radius: 8px; overflow: hidden; }
.swatch { flex: 1; display: flex; align-items: flex-end; padding: 4px 6px; font-size: 10px; font-weight: 500; }
.label { font-size: 11px; color: #737373; margin-bottom: 6px; letter-spacing: 0.05em; }
</style></head><body>
<div>
  <div class="label">Mutsu Pink Palette</div>
  <div class="scale">
    <div class="swatch" style="background: #fff5f8; color: #4a3545;">50</div>
    <div class="swatch" style="background: #ffe4ec; color: #4a3545;">100</div>
    <div class="swatch" style="background: #ffc8d9; color: #4a3545;">200</div>
    <div class="swatch" style="background: #F1D0DB; color: #4a3545;">300</div>
    <div class="swatch" style="background: #EC92AD; color: #fff;">500</div>
    <div class="swatch" style="background: #ff6b9d; color: #fff;">400</div>
    <div class="swatch" style="background: #d4779a; color: #fff;">600</div>
    <div class="swatch" style="background: #b85c82; color: #fff;">700</div>
    <div class="swatch" style="background: #4a3545; color: #fff;">800</div>
    <div class="swatch" style="background: #2d1f2a; color: #fff;">900</div>
  </div>
</div>
</body></html>
