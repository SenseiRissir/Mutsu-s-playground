<!DOCTYPE html>

.logos { display: flex; gap: 20px; align-items: center; }
.logo-box { padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }

<div class="label">Character & Logos</div>
<div class="logos">
  <div class="logo-box" style="background: #fff; border: 1px solid #e5e5e5;">
    <img src="../assets/favicon.svg" alt="Mutsu Character" style="height: 64px;">
  </div>
  <div class="logo-box" style="background: #fff; border: 1px solid #e5e5e5;">
    <img src="../assets/logo-light.svg" alt="Logo Light">
  </div>
  <div class="logo-box" style="background: #1a1a2e;">
    <img src="../assets/logo-dark.svg" alt="Logo Dark">
  </div>
</div>
</body></html>
