<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui; }

.row { display: flex; gap: 8px; align-items: center; }
.combo { font-weight: 700; padding: 4px 12px; border-radius: 8px; background: rgba(255,255,255,0.06); }
</style></head><body>
<div class="label">Combo Escalation</div>
<div class="row">
  <span class="combo" style="color:#ff6b9d; font-size:14px">×2</span>
  <span class="combo" style="color:#ff4577; font-size:16px">×3!</span>
  <span class="combo" style="color:#ff1744; font-size:18px">×4!!</span>
  <span class="combo" style="color:#ff0000; font-size:22px; text-shadow: 0 0 10px rgba(255,0,0,0.5)">×5+!!!</span>
</div>
</body></html>
